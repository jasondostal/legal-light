name: ShootingHours
options:
  bundleIdPrefix: dev.ducktyping
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  HoursCore:
    path: HoursCore
settings:
  base:
    DEVELOPMENT_TEAM: 8N87FTKWXL
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  ShootingHours:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Widget/HoursWidgetView.swift
      - path: Widget/HuntLiveActivity.swift
    dependencies:
      - package: HoursCore
      - target: HoursWidget
        embed: true
    entitlements:
      path: App/ShootingHours.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.ducktyping.shootinghours
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Legal Light
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocationWhenInUseUsageDescription: Your spot decides which shooting-hours zone you're in. Your location stays on your phone.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        UIAppFonts:
          - Silkscreen-Regular.ttf
          - Silkscreen-Bold.ttf
          - JetBrainsMono.ttf
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ducktyping.shootinghours
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Mallard AppIcon-Teal AppIcon-Deer AppIcon-Squirrel AppIcon-Turkey
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
  HoursWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    dependencies:
      - package: HoursCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widget/HoursWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.ducktyping.shootinghours
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Legal Light
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Silkscreen-Regular.ttf
          - Silkscreen-Bold.ttf
          - JetBrainsMono.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ducktyping.shootinghours.widget
        SKIP_INSTALL: true
